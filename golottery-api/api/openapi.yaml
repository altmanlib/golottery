        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxyCheckinRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAttendee"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/guest/staff/attendees:
    get:
      operationId: searchStaffAttendees
      summary: Find roster people by name, at most 20
      tags: [guest]
      security:
        - guestBearer: []
      parameters:
        - $ref: "#/components/parameters/Query"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAttendee"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/guest/staff/checkin-settings:
    patch:
      operationId: updateStaffSettings
      summary: Switch check-in mode or move the fence (admin role only)
      tags: [guest]
      security:
        - guestBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffSettingsRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestStatus"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/organization/events/{eventId}/reset:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      operationId: resetLiveData
      summary: Clear a trial run before check-in opens; the roster, prizes and staff stay
      tags: [organization]
      security:
        - consoleBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetRequest"
      responses:
        "200":
          description: What was cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/organization/events/{eventId}/exports/checkin-attempts:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: exportCheckinAttempts
      summary: Every check-in tap with coordinates, as xlsx in Asia/Shanghai
      tags: [organization]
      security:
        - consoleBearer: []
      responses:
        "200":
          description: xlsx workbook
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  parameters:
    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Query:
      name: q
      in: query
      schema:
        type: string
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PrizeId:
      name: prizeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttendeeId:
      name: attendeeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 40
  securitySchemes:
    platformBearer:
      type: http
      scheme: bearer
      description: Platform operator token from platformLogin
    consoleBearer:
      type: http
      scheme: bearer
      description: Organization admin token from organizationLogin
    guestBearer:
      type: http
      scheme: bearer
      description: Guest token from guestLogin, valid for one event
  responses:
    Error:
      description: Business error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INTERNAL_ERROR
        message:
          type: string
        requestId:
          type: string
          nullable: true
    Healthz:
      type: object
      required: [ok, service, ts]
      properties:
        ok:
          type: boolean
        service:
          type: string
          example: golottery-api
        ts:
          type: string
          format: date-time
        db:
          type: string
          description: Database status
          enum: [up, down, skipped]
        redis:
          type: string
          description: Redis status; informational, it does not change ok
          enum: [up, down, skipped]
    ApiInfo:
      type: object
      required: [name, phase, stack, docs]
      properties:
        name:
          type: string
          example: golottery
        phase:
          type: string
          example: M0
        stack:
          type: string
          example: echo+gorm+postgresql
        docs:
          type: array
          items:
            type: string
    PlatformLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
    SessionToken:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: Bearer token plaintext; returned only once
        expires_at:
          type: string
          format: date-time
    PlatformMe:
      type: object
      required: [username]
      properties:
        username:
          type: string
    OrgStatus:
      type: string
      enum: [active, disabled]
    OrgSummary:
      type: object
      required: [id, name, contact, status, event_credits, max_attendees, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        contact:
          type: string
        status:
          $ref: "#/components/schemas/OrgStatus"
        event_credits:
          type: integer
          description: Remaining event credits
        max_attendees:
          type: integer
          description: Default attendee limit copied into new events
        created_at:
          type: string
          format: date-time
    OrgPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrgSummary"
        total:
          type: integer
    OrgDetail:
      type: object
      required: [org, ledger]
      properties:
        org:
          $ref: "#/components/schemas/OrgSummary"
        ledger:
          type: array
          description: Latest 20 entries, newest first
          items:
            $ref: "#/components/schemas/LedgerEntry"
    LedgerEntry:
      type: object
      required: [id, delta, balance_after, reason, operator_type, operator_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        delta:
          type: integer
        balance_after:
          type: integer
        reason:
          type: string
        event_id:
          type: string
          format: uuid
          nullable: true
        operator_type:
          type: string
          description: principal_type of the token that made the change
        operator_id:
          type: string
        created_at:
          type: string
          format: date-time
    CreateOrgRequest:
      type: object
      required: [name, event_credits, max_attendees]
      properties:
        name:
          type: string
          maxLength: 100
        contact:
          type: string
          maxLength: 100
        event_credits:
          type: integer
          minimum: 0
        max_attendees:
          type: integer
          minimum: 1
    AdjustCreditsRequest:
      type: object
      required: [delta, reason]
      properties:
        delta:
          type: integer
          description: Non-zero; negative removes credits
        reason:
          type: string
          maxLength: 200
    SetMaxAttendeesRequest:
      type: object
      required: [max_attendees]
      properties:
        max_attendees:
          type: integer
          minimum: 1
    OrgUserStatus:
      type: string
      enum: [active, disabled]
    OrgUser:
      type: object
      required: [id, name, email, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        status:
          $ref: "#/components/schemas/OrgUserStatus"
        created_at:
          type: string
          format: date-time
    OrgUserWithPassword:
      type: object
      required: [user, password]
      properties:
        user:
          $ref: "#/components/schemas/OrgUser"
        password:
          type: string
          description: Temporary password; returned only once
    OneTimePassword:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: Temporary password; returned only once
    CreateOrgUserRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 254
    OrganizationLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    OrganizationSession:
      type: object
      required: [token, expires_at, org_id]
      properties:
        token:
          type: string
          description: Bearer token plaintext; returned only once
        expires_at:
          type: string
          format: date-time
        org_id:
          type: string
          format: uuid
    OrganizationMe:
      type: object
      required: [name, email, org_id, org_name, event_credits]
      properties:
        name:
          type: string
        email:
          type: string
        org_id:
          type: string
          format: uuid
        org_name:
          type: string
        event_credits:
          type: integer
          description: Remaining event credits of the organization
    EventStatus:
      type: string
      enum: [draft, ready, closed]
    CheckinMode:
      type: string
      enum: [geo, direct]
    Event:
      type: object
      required: [id, public_id, name, status, checkin_mode, radius_m, allow_multi_win, max_attendees, attendee_count, prize_count, credit_consumed, created_at]
      properties:
        id:
          type: string
          format: uuid
        public_id:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/EventStatus"
        checkin_mode:
          $ref: "#/components/schemas/CheckinMode"
        center_lat:
          type: number
          format: double
          nullable: true
          description: GCJ-02 latitude
        center_lng:
          type: number
          format: double
          nullable: true
          description: GCJ-02 longitude
        radius_m:
          type: integer
        checkin_start:
          type: string
          format: date-time
          nullable: true
        checkin_end:
          type: string
          format: date-time
          nullable: true
        allow_multi_win:
          type: boolean
        max_attendees:
          type: integer
        attendee_count:
          type: integer
        prize_count:
          type: integer
        credit_consumed:
          type: boolean
          description: Whether this event has already used its credit
        created_at:
          type: string
          format: date-time
    EventPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        total:
          type: integer
    CreateEventRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
    UpdateEventRequest:
      type: object
      description: Only the fields present change.
      properties:
        name:
          type: string
          maxLength: 100
        checkin_mode:
          $ref: "#/components/schemas/CheckinMode"
        center_lat:
          type: number
          format: double
        center_lng:
          type: number
          format: double
        radius_m:
          type: integer
          minimum: 100
          maximum: 1000
        checkin_start:
          type: string
          format: date-time
        checkin_end:
          type: string
          format: date-time
        allow_multi_win:
          type: boolean
        status:
          $ref: "#/components/schemas/EventStatus"
    EventEntry:
      type: object
      required: [public_id, path]
      properties:
        public_id:
          type: string
        path:
          type: string
          example: pages/index/index?e=V1StGXR8_Z5jdHi6B-myT
    Prize:
      type: object
      required: [id, name, gift, quota, sort_no]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        gift:
          type: string
        quota:
          type: integer
        sort_no:
          type: integer
    PrizeInput:
      type: object
      required: [name, quota, sort_no]
      properties:
        name:
          type: string
          maxLength: 100
        gift:
          type: string
          maxLength: 200
        quota:
          type: integer
          minimum: 1
        sort_no:
          type: integer
    PrizeUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        gift:
          type: string
          maxLength: 200
        quota:
          type: integer
          minimum: 1
        sort_no:
          type: integer
    Attendee:
      type: object
      required: [id, name, dept, phone_last4, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        dept:
          type: string
        phone_last4:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
    AttendeePage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Attendee"
        total:
          type: integer
    AttendeeInput:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          maxLength: 100
        dept:
          type: string
          maxLength: 100
        phone:
          type: string
          description: Full phone or its last four digits; only the last four are stored
    AttendeeUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        dept:
          type: string
          maxLength: 100
        phone:
          type: string
    ImportResult:
      type: object
      required: [imported]
      properties:
        imported:
          type: integer
    ImportRowError:
      type: object
      required: [row, reason]
      properties:
        row:
          type: integer
          description: Spreadsheet row number; the header is row 1
        reason:
          type: string
    ImportError:
      type: object
      required: [code, message, rows]
      properties:
        code:
          type: string
        message:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowError"
    GuestLoginRequest:
      type: object
      required: [public_id]
      properties:
        public_id:
          type: string
        code:
          type: string
          description: Mini program login code (wechat mode)
        device_id:
          type: string
          description: Random id kept by the browser, 16-60 of [A-Za-z0-9_-] (web mode)
    GuestBindRequest:
      type: object
      required: [name, phone_last4]
      properties:
        name:
          type: string
        phone_last4:
          type: string
    CoordType:
      type: string
      enum: [gcj02, wgs84]
      description: Browsers report wgs84; the mini program reports gcj02
    GuestCheckinRequest:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        accuracy:
          type: number
          format: double
          description: Horizontal accuracy in meters
        coord_type:
          $ref: "#/components/schemas/CoordType"
    ManualRequestInput:
      type: object
      properties:
        name:
          type: string
          description: Required before binding
        phone_last4:
          type: string
          description: Required before binding
        reason:
          type: string
          maxLength: 200
    CheckinMethod:
      type: string
      enum: [geo, direct, manual, proxy]
    GuestEvent:
      type: object
      required: [name, status, checkin_mode]
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/EventStatus"
        checkin_mode:
          $ref: "#/components/schemas/CheckinMode"
        checkin_start:
          type: string
          format: date-time
          nullable: true
        checkin_end:
          type: string
          format: date-time
          nullable: true
    GuestAttendee:
      type: object
      required: [name, dept, checked_in]
      properties:
        name:
          type: string
        dept:
          type: string
        checked_in:
          type: boolean
        checkin_at:
          type: string
          format: date-time
          nullable: true
        checkin_method:
          $ref: "#/components/schemas/CheckinMethod"
    GuestRequest:
      type: object
      required: [status, created_at]
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
        created_at:
          type: string
          format: date-time
    StaffRole:
      type: string
      enum: [staff, admin]
    GuestStatus:
      type: object
      required: [event]
      properties:
        event:
          $ref: "#/components/schemas/GuestEvent"
        attendee:
          $ref: "#/components/schemas/GuestAttendee"
        request:
          $ref: "#/components/schemas/GuestRequest"
        staff_role:
          $ref: "#/components/schemas/StaffRole"
    StaffInviteRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/StaffRole"
    StaffInvite:
      type: object
      required: [code, role, expires_at, path]
      properties:
        code:
          type: string
          description: One-time invite code; returned only once
        role:
          $ref: "#/components/schemas/StaffRole"
        expires_at:
          type: string
          format: date-time
        path:
          type: string
          description: Web path that opens the invite, relative to the site root
    StaffMember:
      type: object
      required: [id, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/StaffRole"
        attendee_name:
          type: string
          nullable: true
          description: Roster name the staff identity is bound to, if any
        created_at:
          type: string
          format: date-time
    JoinStaffRequest:
      type: object
      required: [invite]
      properties:
        invite:
          type: string
    StaffSummary:
      type: object
      required: [total, checked_in, pending_requests]
      properties:
        total:
          type: integer
        checked_in:
          type: integer
        pending_requests:
          type: integer
    StaffAttendee:
      type: object
      required: [id, name, dept, phone_last4, checked_in, bound]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        dept:
          type: string
        phone_last4:
          type: string
        checked_in:
          type: boolean
        bound:
          type: boolean
        checkin_method:
          $ref: "#/components/schemas/CheckinMethod"
    PendingRequest:
      type: object
      required: [id, claimed_name, claimed_phone_last4, reason, created_at]
      properties:
        id:
          type: string
          format: uuid
        attendee:
          $ref: "#/components/schemas/StaffAttendee"
        claimed_name:
          type: string
        claimed_phone_last4:
          type: string
        reason:
          type: string
        created_at:
          type: string
          format: date-time
    ApproveRequest:
      type: object
      description: Empty for a bound guest; otherwise link an existing person or create one.
      properties:
        attendee_id:
          type: string
          format: uuid
        create:
          $ref: "#/components/schemas/AttendeeInput"
    ProxyCheckinRequest:
      type: object
      required: [attendee_id]
      properties:
        attendee_id:
          type: string
          format: uuid
    StaffSettingsRequest:
      type: object
      properties:
        checkin_mode:
          $ref: "#/components/schemas/CheckinMode"
        center_lat:
          type: number
          format: double
        center_lng:
          type: number
          format: double
        radius_m:
          type: integer
        coord_type:
          $ref: "#/components/schemas/CoordType"
    ResetRequest:
      type: object
      required: [confirm_name]
      properties:
        confirm_name:
          type: string
          description: Must equal the event name
    ResetResult:
      type: object
      required: [unbound, attempts, requests, sessions]
      properties:
        unbound:
          type: integer
          description: Roster people whose binding or check-in was cleared
        attempts:
          type: integer
        requests:
          type: integer
        sessions:
          type: integer
