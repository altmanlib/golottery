openapi: 3.0.3
info:
  title: golottery API
  version: 0.1.0
  description: Positioning check-in and on-site lottery API.
servers:
  - url: http://127.0.0.1:5568
    description: Local development
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness and database ping
      tags: [system]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"
        "503":
          description: Service or database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api:
    get:
      operationId: getApiInfo
      summary: Service metadata
      tags: [system]
      responses:
        "200":
          description: Basic service info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiInfo"
  /openapi.yaml:
    get:
      operationId: getOpenAPIYaml
      summary: OpenAPI document (YAML)
      tags: [system]
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string
              example: "openapi: 3.0.3"
  /openapi.json:
    get:
      operationId: getOpenAPIJSON
      summary: OpenAPI document (JSON)
      tags: [system]
      responses:
        "200":
          description: OpenAPI JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/platform/login:
    post:
      operationId: platformLogin
      summary: Platform operator login
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformLoginRequest"
      responses:
        "200":
          description: Login succeeded; the token is shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionToken"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/platform/logout:
    post:
      operationId: platformLogout
      summary: Revoke the current platform token
      tags: [platform]
      security:
        - platformBearer: []
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Error"
  /api/platform/me:
    get:
      operationId: getPlatformMe
      summary: Current platform operator
      tags: [platform]
      security:
        - platformBearer: []
      responses:
        "200":
          description: Current operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformMe"
        "401":
          $ref: "#/components/responses/Error"
  /api/platform/password:
    post:
      operationId: changePlatformPassword
      summary: Change the platform operator password
      description: Revokes every token of the operator and returns a new one.
      tags: [platform]
      security:
        - platformBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed; the new token is shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionToken"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/platform/orgs:
    get:
      operationId: listOrgs
      summary: List organizations, newest first
      tags: [platform]
      security:
        - platformBearer: []
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgPage"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createOrg
      summary: Open an organization with its initial quota
      tags: [platform]
      security:
        - platformBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
      responses:
        "201":
          description: Organization opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSummary"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/platform/orgs/{orgId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: getOrg
      summary: Organization, quota and the latest 20 ledger entries
      tags: [platform]
      security:
        - platformBearer: []
      responses:
        "200":
          description: Organization detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDetail"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/platform/orgs/{orgId}/disable:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: disableOrg
      summary: Disable an organization; idempotent
      tags: [platform]
      security:
        - platformBearer: []
      responses:
        "204":
          description: Organization is disabled
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/platform/orgs/{orgId}/enable:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: enableOrg
      summary: Enable an organization; idempotent
      tags: [platform]
      security:
        - platformBearer: []
      responses:
        "204":
          description: Organization is active
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/platform/orgs/{orgId}/credits:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: adjustOrgCredits
      summary: Add or remove event credits with a reason
      tags: [platform]
      security:
        - platformBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustCreditsRequest"
      responses:
        "200":
          description: The ledger entry written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntry"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/platform/orgs/{orgId}/max-attendees:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: setOrgMaxAttendees
      summary: Change the default attendee limit for events created afterwards
      tags: [platform]
      security:
        - platformBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMaxAttendeesRequest"
      responses:
        "204":
          description: Limit updated
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/platform/orgs/{orgId}/users:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listOrgUsers
      summary: Admins of an organization
      tags: [platform]
      security:
        - platformBearer: []
      responses:
        "200":
          description: Admins, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgUser"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: createOrgUser
      summary: Create an admin with a one-time password
      tags: [platform]
      security:
        - platformBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgUserRequest"
      responses:
        "201":
          description: Admin created; the password is shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUserWithPassword"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/platform/orgs/{orgId}/users/{userId}/reset-password:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: resetOrgUserPassword
      summary: Replace the password and revoke every token of the admin
      tags: [platform]
      security:
        - platformBearer: []
      responses:
        "200":
          description: New one-time password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneTimePassword"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/platform/orgs/{orgId}/users/{userId}/disable:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: disableOrgUser
      summary: Disable an admin and revoke its tokens; idempotent
      tags: [platform]
      security:
        - platformBearer: []
      responses:
        "204":
          description: Admin is disabled
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/platform/orgs/{orgId}/users/{userId}/enable:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: enableOrgUser
      summary: Enable an admin without changing its password; idempotent
      tags: [platform]
      security:
        - platformBearer: []
      responses:
        "204":
          description: Admin is active
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/organization/login:
    post:
      operationId: organizationLogin
      summary: Organization admin login
      tags: [organization]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationLoginRequest"
      responses:
        "200":
          description: Login succeeded; the token is shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSession"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/organization/logout:
    post:
      operationId: organizationLogout
      summary: Revoke the current console token
      tags: [organization]
      security:
        - consoleBearer: []
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Error"
  /api/organization/me:
    get:
      operationId: getOrganizationMe
      summary: Current admin and its organization
      tags: [organization]
      security:
        - consoleBearer: []
      responses:
        "200":
          description: Current admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMe"
        "401":
          $ref: "#/components/responses/Error"
  /api/organization/password:
    post:
      operationId: changeOrganizationPassword
      summary: Change the admin password
      description: Revokes every token of the admin and returns a new one.
      tags: [organization]
      security:
        - consoleBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed; the new token is shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionToken"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/organization/events:
    get:
      operationId: listEvents
      summary: Events of the current organization, newest first
      tags: [organization]
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createEvent
      summary: Create a draft event; no credit is used
      tags: [organization]
      security:
        - consoleBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/organization/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: getEvent
      summary: Event detail
      tags: [organization]
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateEvent
      summary: Change settings or status; the first move to ready uses one credit
      tags: [organization]
      security:
        - consoleBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/organization/events/{eventId}/entry:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: getEventEntry
      summary: Public code and mini program path
      tags: [organization]
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventEntry"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/organization/events/{eventId}/prizes:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: listPrizes
      summary: Prizes by sort_no
      tags: [organization]
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prize"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: createPrize
      summary: Add a prize
      tags: [organization]
      security:
        - consoleBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrizeInput"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prize"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/organization/events/{eventId}/prizes/{prizeId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/PrizeId"
    patch:
      operationId: updatePrize
      summary: Change a prize
      tags: [organization]
      security:
        - consoleBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrizeUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prize"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePrize
      summary: Delete a prize
      tags: [organization]
      security:
        - consoleBearer: []
      responses:
        "204":
          description: Done
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/organization/events/{eventId}/attendees:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: listAttendees
      summary: Roster, in the order it was added
      tags: [organization]
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendeePage"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: createAttendee
      summary: Add one person
      tags: [organization]
      security:
        - consoleBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendeeInput"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendee"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/organization/events/{eventId}/attendees/{attendeeId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/AttendeeId"
    patch:
      operationId: updateAttendee
      summary: Change name, department or phone
      tags: [organization]
      security:
        - consoleBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendeeUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendee"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAttendee
      summary: Remove a person who has not bound, checked in or won
      tags: [organization]
      security:
        - consoleBearer: []
      responses:
        "204":
          description: Done
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/organization/events/{eventId}/attendees/import:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      operationId: importAttendees
      summary: Append roster rows from an xlsx file; any bad row rejects the whole file
      description: The first row holds the headers 姓名, 部门 and 手机号. Files are limited to 5 MB.
      tags: [organization]
      security:
        - consoleBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Rows appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: The file or some rows are invalid; nothing was written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportError"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/organization/events/{eventId}/exports/attendees:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: exportAttendees
      summary: Roster as xlsx, times in Asia/Shanghai
      tags: [organization]
      security:
        - consoleBearer: []
      responses:
        "200":
          description: xlsx workbook
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/organization/events/{eventId}/entry/qrcode:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: getEventQRCode
      summary: Mini program code that opens the event, as PNG
      tags: [organization]
      security:
        - consoleBearer: []
      responses:
        "200":
          description: PNG image
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/platform/orgs/{orgId}/events:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listOrgEvents
      summary: Events of an organization, newest first
      tags: [platform]
      security:
        - platformBearer: []
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/platform/orgs/{orgId}/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/EventId"
    patch:
      operationId: setEventMaxAttendees
      summary: Raise or lower one event's attendee limit; never below its roster
      tags: [platform]
      security:
        - platformBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMaxAttendeesRequest"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/guest/session:
    post:
      operationId: guestLogin
      summary: Sign in a guest for one event
      description: In wechat mode send the mini program login code; in web mode send a device id kept by the browser.
      tags: [guest]
      requestBody:
        required: true
        content:
          application/json:
