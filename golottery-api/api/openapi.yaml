openapi: 3.0.3
info:
  title: golottery API
  version: 0.1.0
  description: Positioning check-in and on-site lottery API.
servers:
  - url: http://127.0.0.1:5568
    description: Local development
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness and database ping
      tags: [system]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"
        "503":
          description: Service or database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api:
    get:
      operationId: getApiInfo
      summary: Service metadata
      tags: [system]
      responses:
        "200":
          description: Basic service info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiInfo"
  /openapi.yaml:
    get:
      operationId: getOpenAPIYaml
      summary: OpenAPI document (YAML)
      tags: [system]
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string
              example: "openapi: 3.0.3"
  /openapi.json:
    get:
      operationId: getOpenAPIJSON
      summary: OpenAPI document (JSON)
      tags: [system]
      responses:
        "200":
          description: OpenAPI JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/platform/login:
    post:
      operationId: platformLogin
      summary: Platform operator login
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformLoginRequest"
      responses:
        "200":
          description: Login succeeded; the token is shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionToken"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/platform/logout:
    post:
      operationId: platformLogout
      summary: Revoke the current platform token
      tags: [platform]
      security:
        - platformBearer: []
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Error"
  /api/platform/me:
    get:
      operationId: getPlatformMe
      summary: Current platform operator
      tags: [platform]
      security:
        - platformBearer: []
      responses:
        "200":
          description: Current operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformMe"
        "401":
          $ref: "#/components/responses/Error"
  /api/platform/password:
    post:
      operationId: changePlatformPassword
      summary: Change the platform operator password
      description: Revokes every token of the operator and returns a new one.
      tags: [platform]
      security:
        - platformBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed; the new token is shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionToken"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/platform/orgs:
    get:
      operationId: listOrgs
      summary: List organizations, newest first
      tags: [platform]
      security:
        - platformBearer: []
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgPage"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createOrg
      summary: Open an organization with its initial quota
      tags: [platform]
      security:
        - platformBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
      responses:
        "201":
          description: Organization opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSummary"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/platform/orgs/{orgId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: getOrg
      summary: Organization, quota and the latest 20 ledger entries
      tags: [platform]
      security:
        - platformBearer: []
      responses:
        "200":
          description: Organization detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDetail"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/platform/orgs/{orgId}/disable:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: disableOrg
      summary: Disable an organization; idempotent
      tags: [platform]
      security:
        - platformBearer: []
      responses:
        "204":
          description: Organization is disabled
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/platform/orgs/{orgId}/enable:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: enableOrg
      summary: Enable an organization; idempotent
      tags: [platform]
      security:
        - platformBearer: []
      responses:
        "204":
          description: Organization is active
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/platform/orgs/{orgId}/credits:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: adjustOrgCredits
      summary: Add or remove event credits with a reason
      tags: [platform]
      security:
        - platformBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustCreditsRequest"
      responses:
        "200":
          description: The ledger entry written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntry"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/platform/orgs/{orgId}/max-attendees:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: setOrgMaxAttendees
      summary: Change the default attendee limit for events created afterwards
      tags: [platform]
      security:
        - platformBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMaxAttendeesRequest"
      responses:
        "204":
          description: Limit updated
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 40
  securitySchemes:
    platformBearer:
      type: http
      scheme: bearer
      description: Platform operator token from platformLogin
  responses:
    Error:
      description: Business error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INTERNAL_ERROR
        message:
          type: string
        requestId:
          type: string
          nullable: true
    Healthz:
      type: object
      required: [ok, service, ts]
      properties:
        ok:
          type: boolean
        service:
          type: string
          example: golottery-api
        ts:
          type: string
          format: date-time
        db:
          type: string
          description: Database status
          enum: [up, down, skipped]
    ApiInfo:
      type: object
      required: [name, phase, stack, docs]
      properties:
        name:
          type: string
          example: golottery
        phase:
          type: string
          example: M0
        stack:
          type: string
          example: echo+gorm+postgresql
        docs:
          type: array
          items:
            type: string
    PlatformLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
    SessionToken:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: Bearer token plaintext; returned only once
        expires_at:
          type: string
          format: date-time
    PlatformMe:
      type: object
      required: [username]
      properties:
        username:
          type: string
    OrgStatus:
      type: string
      enum: [active, disabled]
    OrgSummary:
      type: object
      required: [id, name, contact, status, event_credits, max_attendees, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        contact:
          type: string
        status:
          $ref: "#/components/schemas/OrgStatus"
        event_credits:
          type: integer
          description: Remaining event credits
        max_attendees:
          type: integer
          description: Default attendee limit copied into new events
        created_at:
          type: string
          format: date-time
    OrgPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrgSummary"
        total:
          type: integer
    OrgDetail:
      type: object
      required: [org, ledger]
      properties:
        org:
          $ref: "#/components/schemas/OrgSummary"
        ledger:
          type: array
          description: Latest 20 entries, newest first
          items:
            $ref: "#/components/schemas/LedgerEntry"
    LedgerEntry:
      type: object
      required: [id, delta, balance_after, reason, operator_type, operator_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        delta:
          type: integer
        balance_after:
          type: integer
        reason:
          type: string
        event_id:
          type: string
          format: uuid
          nullable: true
        operator_type:
          type: string
          description: principal_type of the token that made the change
        operator_id:
          type: string
        created_at:
          type: string
          format: date-time
    CreateOrgRequest:
      type: object
      required: [name, event_credits, max_attendees]
      properties:
        name:
          type: string
          maxLength: 100
        contact:
          type: string
          maxLength: 100
        event_credits:
          type: integer
          minimum: 0
        max_attendees:
          type: integer
          minimum: 1
    AdjustCreditsRequest:
      type: object
      required: [delta, reason]
      properties:
        delta:
          type: integer
          description: Non-zero; negative removes credits
        reason:
          type: string
          maxLength: 200
    SetMaxAttendeesRequest:
      type: object
      required: [max_attendees]
      properties:
        max_attendees:
          type: integer
          minimum: 1
